<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cuolingo — recognition drill for C and Python</title>
<style>:root {
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --rail-w:268px;
  --bg-2:var(--surface); --bg-3:var(--surface-2);
  --rule:var(--border); --rule-soft:var(--surface-3);
  --fg:var(--text); --dim:var(--text-dim); --dimmer:var(--line-strong);
  --amber:var(--accent); --teal:var(--good); --rose:var(--danger);
  --bg:#F1F5F4; --surface:#FFFFFF; --border:#D6E1DE; --text:#152220; --text-dim:#4F6663;
  --accent:#0F6B63; --accent-lt:#C2E2DD; --accent-dk:#094A44; --accent-ink:#094A44; --accent-rgb:15,107,99;
  --surface-2:#E6EDEB; --surface-3:#D6E1DE; --line-strong:#AFC0BC; --text-strong:#0B1716; --bg-deep:#E9F0EE;
  --accent-text:#FFFFFF; --on-accent-ink:#FFFFFF; --good:#1F5FB5; --good-rgb:31,95,181;
  --warn:#8A5A0C; --warn-rgb:138,90,12; --danger:#A83228; --danger-rgb:168,50,40;
  --wash-1:rgba(15,107,99,.13); --wash-2:rgba(9,74,68,.06);
  --shadow:0 1px 2px rgba(21,34,32,.05), 0 6px 18px -8px rgba(21,34,32,.15); --ring-focus:#094A44;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { --bg:#040808; --surface:#0A1211; --border:#1A2827; --text:#DAEAE7; --text-dim:#8AA6A2;
  --accent:#3FD1BE; --accent-lt:#8AE7DA; --accent-dk:#12766B; --accent-ink:#8AE7DA; --accent-rgb:63,209,190;
  --surface-2:#101A19; --surface-3:#1A2827; --line-strong:#2B3C3A; --text-strong:#ECF6F4; --bg-deep:#010404;
  --accent-text:#040808; --on-accent-ink:#040808; --good:#5AA9F0; --good-rgb:90,169,240;
  --warn:#E8B23E; --warn-rgb:232,178,62; --danger:#F2685C; --danger-rgb:242,104,92;
  --wash-1:rgba(63,209,190,.10); --wash-2:rgba(138,231,218,.05);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.62); --ring-focus:#8AE7DA; }
}
:root[data-theme="light"] { --bg:#F1F5F4; --surface:#FFFFFF; --border:#D6E1DE; --text:#152220; --text-dim:#4F6663;
  --accent:#0F6B63; --accent-lt:#C2E2DD; --accent-dk:#094A44; --accent-ink:#094A44; --accent-rgb:15,107,99;
  --surface-2:#E6EDEB; --surface-3:#D6E1DE; --line-strong:#AFC0BC; --text-strong:#0B1716; --bg-deep:#E9F0EE;
  --accent-text:#FFFFFF; --on-accent-ink:#FFFFFF; --good:#1F5FB5; --good-rgb:31,95,181;
  --warn:#8A5A0C; --warn-rgb:138,90,12; --danger:#A83228; --danger-rgb:168,50,40;
  --wash-1:rgba(15,107,99,.13); --wash-2:rgba(9,74,68,.06);
  --shadow:0 1px 2px rgba(21,34,32,.05), 0 6px 18px -8px rgba(21,34,32,.15); --ring-focus:#094A44; }
:root[data-theme="dark"] { --bg:#040808; --surface:#0A1211; --border:#1A2827; --text:#DAEAE7; --text-dim:#8AA6A2;
  --accent:#3FD1BE; --accent-lt:#8AE7DA; --accent-dk:#12766B; --accent-ink:#8AE7DA; --accent-rgb:63,209,190;
  --surface-2:#101A19; --surface-3:#1A2827; --line-strong:#2B3C3A; --text-strong:#ECF6F4; --bg-deep:#010404;
  --accent-text:#040808; --on-accent-ink:#040808; --good:#5AA9F0; --good-rgb:90,169,240;
  --warn:#E8B23E; --warn-rgb:232,178,62; --danger:#F2685C; --danger-rgb:242,104,92;
  --wash-1:rgba(63,209,190,.10); --wash-2:rgba(138,231,218,.05);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.62); --ring-focus:#8AE7DA; }


*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber);color:var(--accent-text)}

.shell{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:var(--rail-w);flex:none;position:sticky;top:0;height:100vh;
  background:var(--bg-2);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
}
.rail-head{padding:22px 20px 14px;border-bottom:1px solid var(--rule-soft)}
.mark{
  font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.035em;
  line-height:1;margin:0;color:var(--fg);
}
.mark span{color:var(--amber)}
.mark-sub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dimmer);margin-top:8px;
}
.search-wrap{padding:14px 16px;border-bottom:1px solid var(--rule-soft);position:relative}
#q{
  width:100%;background:var(--bg-3);border:1px solid var(--rule);border-radius:6px;
  color:var(--fg);font-family:var(--mono);font-size:13px;padding:9px 34px 9px 11px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#q::placeholder{color:var(--dimmer)}
#q:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.13)}
.slash{
  position:absolute;right:26px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--dimmer);
  border:1px solid var(--rule);border-radius:4px;padding:1px 5px;pointer-events:none;
}
#q:focus + .slash{opacity:0}
nav{overflow-y:auto;padding:10px 10px 40px;flex:1;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
nav::-webkit-scrollbar{width:8px}
nav::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
nav a{
  display:flex;gap:10px;align-items:baseline;
  padding:6px 10px;border-radius:5px;text-decoration:none;
  color:var(--dim);font-size:13.5px;transition:color .12s,background .12s;
}
nav a b{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);font-weight:500;min-width:26px}
nav a:hover{background:var(--bg-3);color:var(--fg)}
nav a.on{background:var(--bg-3);color:var(--amber)}
nav a.on b{color:var(--amber)}
nav a.hide{display:none}

main{flex:1;min-width:0;padding:0 clamp(18px,4vw,56px) 120px;max-width:1060px}

/* ---------- hero ---------- */
.hero{padding:clamp(48px,8vh,88px) 0 44px;border-bottom:1px solid var(--rule)}
.hero h1{
  font-family:var(--disp);font-weight:800;letter-spacing:-.035em;
  font-size:clamp(46px,8vw,82px);line-height:.94;margin:0 0 18px;
}
.hero h1 em{font-style:normal;color:var(--amber)}
.lede{font-size:17px;color:var(--dim);max-width:58ch;margin:0 0 26px}
.lede code{font-family:var(--mono);color:var(--teal);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--rule);border-radius:100px;padding:4px 11px;
}

/* ---------- memory strip ---------- */
.memstrip{
  margin-top:36px;background:var(--bg-2);border:1px solid var(--rule);border-radius:10px;
  padding:20px 20px 16px;overflow-x:auto;
}
.memstrip-title{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:16px;
}
.regions{display:flex;gap:clamp(20px,6vw,64px);min-width:520px;align-items:flex-start}
.region-label{
  font-family:var(--mono);font-size:11px;color:var(--dimmer);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;
}
.cells{display:flex}
.cell{
  width:76px;border:1px solid var(--rule);border-right:none;background:var(--bg-3);
  padding:9px 8px;text-align:center;
}
.cell:last-child{border-right:1px solid var(--rule)}
.cell .val{font-family:var(--mono);font-size:13px;color:var(--fg)}
.cell .val.ptr{color:var(--amber)}
.cell .nm{font-family:var(--mono);font-size:10.5px;color:var(--teal);margin-top:5px}
.cell .ad{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);margin-top:2px}
.arrowline{
  flex:1;min-width:60px;align-self:center;margin-top:14px;height:1px;background:var(--amber);
  position:relative;opacity:.75;
}
.arrowline::after{
  content:"";position:absolute;right:-1px;top:-4px;
  border-left:8px solid var(--amber);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
}
.memstrip-cap{
  margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--dim);
  border-top:1px solid var(--rule-soft);padding-top:12px;line-height:1.8;
}
.memstrip-cap span{color:var(--amber)}

/* ---------- sections ---------- */
section{padding-top:52px;scroll-margin-top:20px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.sec-num{
  font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.05em;
  border:1px solid rgba(var(--accent-rgb),.35);border-radius:4px;padding:2px 7px;flex:none;
}
h2{
  font-family:var(--disp);font-weight:700;letter-spacing:-.02em;
  font-size:clamp(25px,3.4vw,33px);margin:0;line-height:1.15;
}
.sec-blurb{color:var(--dim);margin:0 0 22px;max-width:68ch;font-size:14.5px}
.sec-blurb code{font-family:var(--mono);font-size:13px;color:var(--teal)}
.sec-blurb strong{color:var(--fg);font-weight:500}
.rule{height:1px;background:var(--rule);margin-bottom:24px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{
  background:var(--bg-2);border:1px solid var(--rule-soft);border-radius:9px;
  padding:16px 18px 18px;min-width:0;
}
.card h3{
  font-family:var(--sans);font-weight:600;font-size:14.5px;margin:0 0 8px;
  color:var(--fg);
}
.card p{margin:0 0 12px;color:var(--dim);font-size:13.5px}
.card p:last-child{margin-bottom:0}
.card p strong{color:var(--fg);font-weight:500}
.card ul{margin:0 0 12px;padding-left:18px;color:var(--dim);font-size:13.5px}
.card ul:last-child{margin-bottom:0}
.card li{margin-bottom:6px}
.card li:last-child{margin-bottom:0}
.card li strong{color:var(--fg);font-weight:500}
p code,td code,li code{
  font-family:var(--mono);font-size:12.5px;color:var(--teal);
  background:var(--bg-3);padding:1px 5px;border-radius:3px;
}
.card.warn{border-color:rgba(var(--danger-rgb),.3);background:rgba(var(--danger-rgb),.045)}
.card.warn h3{color:var(--rose)}
.card.warn h3::before{content:"⚠  ";font-size:12px}
.takeaway{
  border-left:2px solid var(--amber);padding:2px 0 2px 12px;
  color:var(--fg)!important;font-size:13.5px;margin-top:12px!important;
}
.takeaway code{background:transparent;padding:0}

/* ---------- code ---------- */
.codewrap{position:relative;margin:0 0 12px}
.codewrap:last-child{margin-bottom:0}
pre{
  margin:0;background:var(--bg);border:1px solid var(--rule-soft);border-radius:7px;
  padding:13px 15px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--fg);
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
pre::-webkit-scrollbar{height:8px}
pre::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
.cm{color:var(--dimmer);font-style:italic}
.copy{
  position:absolute;top:7px;right:7px;background:var(--bg-3);border:1px solid var(--rule);
  color:var(--dimmer);font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 8px;border-radius:4px;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s;
}
.codewrap:hover .copy,.copy:focus{opacity:1}
.copy:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:0 0 12px}
.tw:last-child{margin-bottom:0}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:340px}
th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dimmer);font-weight:500;
  padding:0 12px 8px 0;border-bottom:1px solid var(--rule);
}
td{padding:7px 12px 7px 0;border-bottom:1px solid var(--rule-soft);color:var(--dim);vertical-align:top}
td:first-child{font-family:var(--mono);color:var(--amber);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:none}

/* ---------- misc ---------- */
.empty{display:none;padding:60px 0;color:var(--dim);font-family:var(--mono);font-size:14px}
.empty.show{display:block}
.empty b{color:var(--amber);font-weight:500}
section.hide,.card.hide{display:none}
.totop{
  position:fixed;right:22px;bottom:22px;width:38px;height:38px;border-radius:50%;
  background:var(--bg-3);border:1px solid var(--rule);color:var(--dim);
  display:grid;place-items:center;text-decoration:none;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s,color .15s;z-index:20;
}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{color:var(--amber);border-color:var(--amber)}
.railbtn{display:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

@media (max-width:880px){
  :root{--rail-w:100%}
  .shell{flex-direction:column}
  .rail{position:sticky;top:0;height:auto;width:100%;border-right:none;border-bottom:1px solid var(--rule);z-index:30}
  .rail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .mark{font-size:24px}
  .mark-sub{display:none}
  .railbtn{
    display:block;background:var(--bg-3);border:1px solid var(--rule);color:var(--dim);
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    padding:6px 11px;border-radius:5px;cursor:pointer;
  }
  nav{display:none;max-height:52vh}
  nav.open{display:block}
  .slash{display:none}
  main{padding:0 18px 90px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

/* Layout. Three columns wherever there is room for three, because the fault
   this replaced was 370px of stranded background on each side at 1920 and a
   rail whose four-line blocks were 387px tall. Width is filled with the unit
   list -- a real module that was previously hidden behind a tab -- not with a
   wider cap over the same content. */
.wrap{max-width:1560px;margin-inline:auto;padding:18px clamp(14px,2.4vw,30px) 44px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-family:var(--disp);font-size:22px;letter-spacing:-.03em;margin:0;
  color:var(--text-strong);line-height:1}
.top .sub{color:var(--text-dim);font-size:12px;font-family:var(--mono)}
.top .sp{flex:1}
.tabs{display:flex;gap:5px}
.tabs button,.iconbtn{appearance:none;font:inherit;font-size:12.5px;cursor:pointer;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:5px 11px;line-height:1.4}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-text);
  border-color:var(--accent)}
.tabs button:hover,.iconbtn:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:214px minmax(0,1fr) 254px;gap:16px;
  align-items:start}
@media (max-width:1240px){.grid{grid-template-columns:minmax(0,1fr) 244px}
  #navrail{display:none}}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:17px 19px}

/* Rails. align-content:start is the fix for the stretched blocks: the column is
   as tall as the page, its blocks are as tall as their text. */
.rail,#navrail{display:grid;gap:11px;align-content:start;position:sticky;top:16px}
.rblock{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px}
.rblock h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 7px;font-weight:600}
.rrow{display:flex;justify-content:space-between;gap:9px;font-size:12.5px;padding:1.5px 0}
.rrow b{font-family:var(--mono);font-weight:600;color:var(--text-strong)}
.rnote{font-size:11px;color:var(--text-dim);margin:7px 0 0;line-height:1.45}

/* Progress bar */
.bar{height:4px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-bottom:13px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}

/* The question */
.en{font-size:18px;font-weight:650;line-height:1.3;color:var(--text-strong);margin:0 0 3px}
.meta{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:0 0 13px}
.teach{border-left:3px solid var(--accent);background:var(--wash-2);padding:10px 13px;
  border-radius:0 8px 8px 0;margin:0 0 13px}
.teach p{margin:0 0 6px;font-size:13px;color:var(--text-dim);line-height:1.5}
.teach pre{margin:0;font-family:var(--mono);font-size:13px;color:var(--text-strong);
  white-space:pre-wrap;word-break:break-word}

/* Options: two across when they are short enough to read side by side. */
.opts{display:grid;gap:7px;margin:0 0 11px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--ring-focus);outline-offset:2px}
.opt.right{border-color:var(--accent);background:var(--wash-1)}
.opt.wrong{border-color:var(--danger);color:var(--danger)}
.opt[disabled]{cursor:default;opacity:.75}
.opt.right,.opt.wrong{opacity:1}
.go{appearance:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-text);border:1px solid var(--accent);
  border-radius:8px;padding:9px 20px;justify-self:start}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:2px solid var(--ring-focus);outline-offset:2px}
.blankwrap{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.blankwrap input{flex:1;min-width:170px;font-family:var(--mono);font-size:13px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px}
.blankwrap input:focus{outline:none;border-color:var(--accent)}
.msg{font-size:13px;margin:0 0 3px}
.msg.ok{color:var(--accent)}
.msg.no{color:var(--danger)}
.note{font-size:12.5px;color:var(--text-dim);line-height:1.55;margin:8px 0 0}
.banner{border:1px solid var(--warn);background:var(--wash-2);color:var(--text);
  border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:13px}

/* Language switch */
.langbar{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.langbar button{appearance:none;font:inherit;font-size:12px;cursor:pointer;padding:5px 12px;
  background:var(--surface-2);color:var(--text-dim);border:0;border-right:1px solid var(--border)}
.langbar button:last-child{border-right:0}
.langbar button[aria-pressed=true]{background:var(--accent);color:var(--accent-text);font-weight:600}
.choose{display:grid;gap:9px;margin:14px 0 0;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.choose button{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:14px 16px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:10px}
.choose button:hover{border-color:var(--accent)}
.choose b{display:block;font-size:14.5px;margin-bottom:3px;color:var(--text-strong)}
.choose span{font-size:12.5px;color:var(--text-dim);line-height:1.5}

/* Character breakdown. On a wide card the line and its list sit side by side,
   so reading one does not push the other off screen. */
.brk{margin:13px 0 0;border-top:1px solid var(--border);padding-top:13px}
.brk h4{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 8px;font-weight:600}
.brkgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.brkgrid.wide{grid-template-columns:minmax(0,1fr) minmax(240px,320px)}
.brkline{font-family:var(--mono);font-size:14px;line-height:1.95;white-space:pre-wrap;
  word-break:break-word;margin-bottom:9px}
.sp{appearance:none;font:inherit;background:none;border:0;padding:1px 0;cursor:pointer;
  border-bottom:2px solid transparent;color:var(--text)}
.sp:hover,.sp[aria-pressed=true]{border-bottom-color:var(--accent);background:var(--wash-1)}
.sp:focus-visible{outline:2px solid var(--ring-focus);outline-offset:1px}
.sp.kw,.sp.fn{color:var(--accent);font-weight:600}
.sp.text,.sp.esc,.sp.fmt,.sp.num{color:var(--good)}
.sp.op,.sp.punct{color:var(--text-dim)}
.sp.comment{color:var(--text-dim);font-style:italic}
.sp.amb{border-bottom:2px dashed var(--warn)}
.spd{font-size:12.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;line-height:1.5}
.spd code{font-family:var(--mono);font-size:12px;color:var(--text-strong)}
.spd .amb{color:var(--warn);font-weight:600}
.brkall{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:4px 11px}
.brkall.many{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  column-gap:20px;padding:4px 13px}
.brkall div{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:12px;
  line-height:1.45;border-radius:5px}
.brkall div:first-child{border-top:0}
.brkall.many div:first-child{border-top:1px solid var(--border)}
.brkall div.on{background:var(--wash-1);margin-inline:-6px;padding-inline:6px}
.brkall code{font-family:var(--mono);min-width:70px;color:var(--text-strong);word-break:break-all}
.brkall span{color:var(--text-dim)}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);font:inherit;font-size:12px;
  cursor:pointer;padding:0;text-decoration:underline}

/* Unit list, promoted out of its tab into the left column */
.units{display:grid;gap:6px}
.unit{display:flex;gap:9px;align-items:baseline;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12.5px}
.unit .nm{flex:1;font-weight:600;line-height:1.3}
.unit .ct{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap}
.unit.tailu{border-style:dashed}
.unit.now{border-color:var(--accent);background:var(--wash-1)}
.log{display:grid;gap:3px;margin-top:2px}
.log div{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  font-size:11.5px;padding:3px 7px;border-radius:5px;background:var(--surface-2);
  border-left:3px solid var(--text-dim)}
.log div.ok{border-left-color:var(--accent)}
.log div.no{border-left-color:var(--danger)}
.log code{font-family:var(--mono);color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.log b{font-family:var(--mono);font-weight:600;color:var(--text-strong);white-space:nowrap}
.hide{display:none}
</style>

s, and every operation on it — filter, group, join — is a loop you write yourself.","hash":"1aedc4be0e18"},{"id":"coll-7/c/absent","row":"coll-7","lang":"c","sec":"b-collect","sec_title":"Collections and indexing","en":"Get one column out of a table","text":"No frames, no columns. See the previous row.","hash":"1d0787c975d2"},{"id":"coll-8/c/absent","row":"coll-8","lang":"c","sec":"b-collect","sec_title":"Collections and indexing","en":"Keep the rows that pass a test","text":"A loop over an array of structs, writing survivors into a second array.","hash":"568660c8abf8"},{"id":"func-2/c/absent","row":"func-2","lang":"c","sec":"b-func","sec_title":"Functions","en":"Give an argument a default","text":"C has no default arguments. The usual answers are two functions, one calling the other, or a struct of options — both of which are more ceremony than the feature is worth.","hash":"92671a81c0a5"},{"id":"func-3/c/absent","row":"func-3","lang":"c","sec":"b-func","sec_title":"Functions","en":"Return more than one value","text":"C returns exactly one value. You return a struct, or you pass a pointer for the second result to be written through — which is what <code>divmod</code>-style functions do.","hash":"2902c0c6853f"},{"id":"func-4/py/absent","row":"func-4","lang":"py","sec":"b-func","sec_title":"Functions","en":"Change the caller's variable from inside","text":"Python passes references to objects, but rebinding a name inside a function never touches the caller's name. Mutating a list or a frame in place does; returning a new value is the habit worth having.","hash":"ffc34ddc2a6d"},{"id":"mem-1/py/absent","row":"mem-1","lang":"py","sec":"b-mem","sec_title":"Memory and ownership","en":"Ask for memory at run time","text":"Never. Objects are allocated when created and freed when the last reference goes away.","hash":"2eb7caff251a"},{"id":"mem-2/py/absent","row":"mem-2","lang":"py","sec":"b-mem","sec_title":"Memory and ownership","en":"Check that the allocation worked","text":"An allocation that fails raises <code>MemoryError</code>; there is nothing to check.","hash":"43900c241b72"},{"id":"mem-3/py/absent","row":"mem-3","lang":"py","sec":"b-mem","sec_title":"Memory and ownership","en":"Give the memory back","text":"The garbage collector does it. <code>del</code> removes a name, not an object.","hash":"9e6ee0040eec"},{"id":"file-4/c/absent","row":"file-4","lang":"c","sec":"b-file","sec_title":"Files and input","en":"Read a CSV into a table","text":"C has no CSV reader. Splitting a line on commas correctly — quotes, embedded commas, CRLF — is a few hundred lines nobody should write twice.","hash":"0715ef220db1"},{"id":"clean-1/c/absent","row":"clean-1","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Count the missing values in each column","text":"No frames. See section 04.","hash":"ed91065661b0"},{"id":"clean-2/c/absent","row":"clean-2","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Fill missing values with the median","text":"No frames.","hash":"a38ac0560202"},{"id":"clean-3/c/absent","row":"clean-3","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Drop rows with missing values","text":"No frames.","hash":"e8576ba9514a"},{"id":"clean-4/c/absent","row":"clean-4","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Convert a column to another type","text":"No frames.","hash":"63a9bc00ddc2"},{"id":"clean-5/c/absent","row":"clean-5","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Remove duplicate rows","text":"No frames.","hash":"c8e4006570d7"},{"id":"clean-6/c/absent","row":"clean-6","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Join two tables on a shared key","text":"No frames. A nested loop, or a hash table you write.","hash":"d4f823e13604"},{"id":"clean-7/c/absent","row":"clean-7","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Group by a column and summarise each group","text":"No frames.","hash":"880f6668e0bf"},{"id":"clean-8/c/absent","row":"clean-8","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Turn long data wide","text":"No frames.","hash":"ff44b095e668"},{"id":"clean-9/c/absent","row":"clean-9","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Count how many of each category","text":"No frames.","hash":"76d7b3ff3f66"},{"id":"stat-2/c/absent","row":"stat-2","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Take the standard deviation","text":"C has no statistics library. You write the two-pass or Welford algorithm yourself — and the naive one-pass formula loses precision on real data.","hash":"72aac95ee147"},{"id":"stat-3/c/absent","row":"stat-3","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Show the type of every column","text":"No frames.","hash":"2ba20c8b487a"},{"id":"stat-4/c/absent","row":"stat-4","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Compare the means of two groups","text":"No statistics library.","hash":"b3a77def764e"},{"id":"stat-5/c/absent","row":"stat-5","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Fit a straight line","text":"No statistics library.","hash":"a1ec1775bd6c"},{"id":"stat-6/c/absent","row":"stat-6","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Read the coefficients back out","text":"No statistics library.","hash":"b54719867349"},{"id":"stat-7/c/absent","row":"stat-7","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Set the random seed so the run repeats","text":"C's <code>rand</code> is seeded with <code>srand(time(NULL))</code>, and none of these fifty solutions needs randomness. Nothing in this file uses it, so nothing here can show you a line that was actually run.","hash":"ebc726e335ad"},{"id":"types-7/py/absent","row":"types-7","lang":"py","sec":"b-types","sec_title":"Values, types and conversion","en":"Find the largest value a type can hold","text":"Python's ints are arbitrary precision: there is no largest one, and the overflow C2.1 demonstrates cannot happen. NumPy arrays do overflow, because they hold fixed-width types.","hash":"523d8403ea40"},{"id":"coll-10/c/absent","row":"coll-10","lang":"c","sec":"b-collect","sec_title":"Collections and indexing","en":"Apply a function to every column","text":"No frames, so no columns to map over.","hash":"7d19a6d8da65"},{"id":"func-7/c/absent","row":"func-7","lang":"c","sec":"b-func","sec_title":"Functions","en":"Take a variable number of arguments","text":"C can, with <code>&lt;stdarg.h&gt;</code>, and nothing checks the types &mdash; which is exactly why <code>printf</code> with the wrong specifier is undefined rather than an error.","hash":"561544ef91a6"},{"id":"mem-4/py/absent","row":"mem-4","lang":"py","sec":"b-mem","sec_title":"Memory and ownership","en":"Grow an allocation that has run out of room","text":"A list grows itself, doubling behind the scenes. The amortised cost is the same; the bookkeeping is not yours.","hash":"540ff88de495"},{"id":"clean-10/c/absent","row":"clean-10","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Keep only the rows whose key is in a list","text":"No frames.","hash":"b6e620121cd2"},{"id":"clean-11/c/absent","row":"clean-11","lang":"c","sec":"b-clean","sec_title":"Cleaning a table","en":"Rename a column","text":"No frames.","hash":"36373520157c"},{"id":"stat-8/c/absent","row":"stat-8","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Get a specific percentile","text":"No statistics library. Sort, then index &mdash; and decide which of the nine interpolation conventions you meant.","hash":"ea66a85f2a67"},{"id":"stat-9/c/absent","row":"stat-9","lang":"c","sec":"b-stat","sec_title":"Summarising and testing","en":"Measure how two columns move together","text":"No statistics library.","hash":"e7d1227527cc"},{"id":"err-4/c/absent","row":"err-4","lang":"c","sec":"b-err","sec_title":"Errors and defensive habits","en":"Catch a failure and carry on","text":"C has no exceptions. Every failure is a return value you check, which is why the check-every-call habit matters so much more here.","hash":"86684672bbe5"},{"id":"struct-4/py/absent","row":"struct-4","lang":"py","sec":"b-struct","sec_title":"Your own types","en":"Hold one of several types in one value","text":"Python needs nothing: a name can already refer to any type, and the object carries its own. The C construct exists because the compiler has to know the size in advance.","hash":"0c7e4ca098c5"},{"id":"text-3/c/absent","row":"text-3","lang":"c","sec":"b-text","sec_title":"Text and dates","en":"Match a pattern rather than a fixed string","text":"C has no regular expressions in the standard library. POSIX <code>&lt;regex.h&gt;</code> exists on Linux and is not portable C; in practice this is where C programs start calling a library.","hash":"367e9ea2d10a"},{"id":"text-4/c/absent","row":"text-4","lang":"c","sec":"b-text","sec_title":"Text and dates","en":"Turn a string of digits into a date","text":"C has <code>strptime</code> on POSIX and nothing in the standard library. Dates in portable C are a struct you fill in yourself.","hash":"be7a5cb76d0d"},{"id":"text-5/c/absent","row":"text-5","lang":"c","sec":"b-text","sec_title":"Text and dates","en":"Subtract two dates","text":"No date type, so no subtraction &mdash; <code>difftime</code> is POSIX and works on <code>time_t</code> seconds.","hash":"a0a23e4a0f42"},{"id":"plot-1/c/absent","row":"plot-1","lang":"c","sec":"b-plot","sec_title":"Making a chart","en":"Start a figure and get somewhere to draw","text":"C has no plotting. A C program that needs a chart writes the numbers out and lets something else draw them &mdash; which is the honest answer to why this course is taught in Python and R.","hash":"71fc360a325a"},{"id":"plot-2/c/absent","row":"plot-2","lang":"c","sec":"b-plot","sec_title":"Making a chart","en":"Draw a histogram","text":"See above.","hash":"5f20b490b2c8"},{"id":"plot-3/c/absent","row":"plot-3","lang":"c","sec":"b-plot","sec_title":"Making a chart","en":"Draw a scatter plot with a fitted line","text":"See above.","hash":"f737ca44ec65"},{"id":"plot-4/c/absent","row":"plot-4","lang":"c","sec":"b-plot","sec_title":"Making a chart","en":"Label the axes and the title","text":"See above.","hash":"60168a3ba697"},{"id":"plot-5/c/absent","row":"plot-5","lang":"c","sec":"b-plot","sec_title":"Making a chart","en":"Save the figure to a file","text":"See above.","hash":"db99148c228d"},{"id":"model-1/c/absent","row":"model-1","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Split the data into train and test","text":"No modelling library. Every row in this section is Python and R only, and that is the reason the course is taught in them.","hash":"79ef28147c96"},{"id":"model-2/c/absent","row":"model-2","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Standardise the features","text":"No modelling library.","hash":"2c7da06e3d81"},{"id":"model-3/c/absent","row":"model-3","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Fit a classifier","text":"No modelling library.","hash":"e1e59f953d3c"},{"id":"model-4/c/absent","row":"model-4","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Fit a logistic regression","text":"No modelling library.","hash":"251d962664b9"},{"id":"model-5/c/absent","row":"model-5","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Predict with a fitted model","text":"No modelling library.","hash":"f91a034e7bc2"},{"id":"model-6/c/absent","row":"model-6","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Score the predictions","text":"No modelling library.","hash":"9b0992e510f8"},{"id":"model-7/c/absent","row":"model-7","lang":"c","sec":"b-model","sec_title":"The modelling workflow","en":"Look at the confusion matrix","text":"No modelling library.","hash":"bde7a8387b0a"},{"id":"pre-2/py/absent","row":"pre-2","lang":"py","sec":"b-pre","sec_title":"The preprocessor and the build","en":"Stop a header being included twice","text":"Python caches modules: importing the same module twice runs it once. There is nothing to guard.","hash":"a966b7d281fb"},{"id":"pre-3/py/absent","row":"pre-3","lang":"py","sec":"b-pre","sec_title":"The preprocessor and the build","en":"Write a macro that takes an argument","text":"Python has no macros. A function is evaluated once and behaves the same everywhere it is called, which is precisely what a macro does not guarantee.","hash":"0f8e1be1f03a"},{"id":"pre-4/py/absent","row":"pre-4","lang":"py","sec":"b-pre","sec_title":"The preprocessor and the build","en":"Compile several files into one program","text":"No compile step. A module is imported at run time and the interpreter finds it on <code>sys.path</code>.","hash":"a43588ac5b22"}],"units":[{"id":"b-print","title":"Printing and formatting","items":["print-1/c","print-1/py","print-2/c","print-2/py","print-3/c","print-3/py","print-4/c","print-4/py","print-5/c","print-5/py","print-6/c","print-6/py","print-7/c","print-7/py"],"langs":["c","py"],"tail":false},{"id":"b-types","title":"Values, types and conversion","items":["types-1/c","types-1/py","types-2/c","types-2/py","types-3/c","types-3/py","types-4/c","types-5/py","types-6/c","types-6/py","types-7/c","types-4/py/absent","types-5/c/absent","types-7/py/absent"],"langs":["c","py"],"tail":false},{"id":"b-flow","title":"Deciding and repeating","items":["flow-1/c","flow-1/py","flow-2/c","flow-2/py","flow-3/c","flow-3/py","flow-4/py","flow-5/c","flow-5/py","flow-6/c","flow-6/py","flow-7/c","flow-7/py","flow-8/c","flow-8/py","flow-4/c/absent"],"langs":["c","py"],"tail":false},{"id":"b-collect","title":"Collections and indexing","items":["coll-1/c","coll-1/py","coll-2/c","coll-2/py","coll-3/py","coll-4/c","coll-4/py","coll-5/c","coll-5/py","coll-6/py","coll-7/py","coll-8/py","coll-9/c","coll-9/py","coll-10/py","coll-11/c","coll-11/py","coll-3/c/absent","coll-6/c/abs <script>
"use strict";
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var KEY = "studyTools.cuolingo.v1", SCHEMA_VERSION = 1;
  var CAP = 20, EASE_START = 2.5, EASE_FLOOR = 1.3;
  var SEED_KEYS = { c: "studyTools.c.v1", py: "studyTools.python.v1" };
  var BY = {}; D.items.forEach(function (i) { BY[i.id] = i; });
  D.absences.forEach(function (a) { a.absent = true; BY[a.id] = a; });

  function today() { return Math.floor(Date.now() / 86400000); }
  function blank() {
    return { v: SCHEMA_VERSION, cards: {}, done: {}, lang: null, log: [],
             streak: { count: 0, last: null, grace: 2 },
             seeded: false, seedFound: 0, theme: null, changed: {} };
  }
  function migrate(s) {
    if (!s || typeof s !== "object") return blank();
    if (s.v === SCHEMA_VERSION) return s;
    if (!s.v) { var b = blank(); for (var k in s) b[k] = s[k]; b.v = SCHEMA_VERSION; s = b; }
    /* Runs on every load, not only on a bump: a field added between builds is
       otherwise missing on any profile that never crossed one. */
    if (!Array.isArray(s.log)) s.log = [];
    if (!s.done || typeof s.done !== "object") s.done = {};
    if (!s.cards || typeof s.cards !== "object") s.cards = {};
    return s;
  }
  var state;
  try { state = migrate(JSON.parse(localStorage.getItem(KEY))); }
  catch (e) { state = blank(); }
  var storageOK = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { if (storageOK) { storageOK = false; warn("This browser refused to save. Progress this session will be lost when you close the tab."); } }
  }
  function warn(msg) {
    var b = document.getElementById("warn");
    b.textContent = msg; b.classList.remove("hide");
  }

  /* ---- seed: read-only, never writes the study files' keys --------------- */
  function seed() {
    if (state.seeded) return;
    var found = 0;
    Object.keys(SEED_KEYS).forEach(function (lang) {
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem(SEED_KEYS[lang])); } catch (e) { return; }
      if (!raw || typeof raw.bridge !== "object" || !raw.bridge) return;
      Object.keys(raw.bridge).forEach(function (row) {
        var id = row + "/" + lang;
        if (BY[id] && !state.cards[id]) { state.cards[id] = card(); state.cards[id].introduced = true; found++; }
      });
    });
    state.seeded = true; state.seedFound = found; save();
  }

  /* ---- SM-2, with the rung counter deliberately separate ----------------- */
  function card() { return { reps: 0, ease: EASE_START, interval: 0, due: 0, rung: 0, introduced: false, hash: null }; }
  function review(c, ok) {
    if (!ok) { c.reps = 0; c.interval = 1; c.ease = Math.max(EASE_FLOOR, c.ease - 0.2); }
    else {
      c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 6 : Math.max(1, Math.round(c.interval * c.ease));
      c.reps += 1; c.ease = Math.min(3.0, c.ease + 0.1);
    }
    c.due = today() + c.interval;
    return c;
  }
  function bumpStreak() {
    var s = state.streak, t = today();
    if (s.last === t) return;
    var gap = s.last === null ? 1 : t - s.last;
    if (gap === 1 || s.last === null) s.count += 1;
    else if (gap - 1 <= s.grace) { s.count += 1; s.grace -= (gap - 1); }
    else { s.count = 1; s.grace = 2; }
    s.last = t;
  }

  /* ---- queue ------------------------------------------------------------ */
  var order = [];
  D.units.forEach(function (u) { if (!u.tail) u.items.forEach(function (id) { order.push(id); }); });
  D.units.forEach(function (u) { if (u.tail) u.items.forEach(function (id) { order.push(id); }); });

  function inLang(id) {
    var it = BY[id];
    return !state.lang || !it || it.lang === state.lang;
  }

  function buildQueue() {
    var t = today(), due = [], fresh = [];
    order.filter(inLang).forEach(function (id) {
      var c = state.cards[id];
      if (!c) { fresh.push(id); }
      else if (c.due <= t && c.reps >= 0 && c.introduced) { due.push(id); }
      else if (!c.introduced) { fresh.push(id); }
    });
    due.sort(function (a, b) { return state.cards[a].due - state.cards[b].due; });
    return { list: due.concat(fresh).slice(0, CAP), backlog: Math.max(0, due.length - CAP) };
  }

  /* ---- session state ---------------------------------------------------- */
  var q = { list: [], backlog: 0 }, pos = 0, phase = "ask", answered = 0, correct = 0;

  function counts() {
    var recog = 0, prod = 0, cards = state.cards;
    for (var id in cards) {
      if (!inLang(id)) continue;
      if (cards[id].reps > 0) recog++;
      if (cards[id].rung >= 1 && cards[id].reps > 0) prod++;
    }
    var total = D.items.filter(function (i) { return !state.lang || i.lang === state.lang; }).length;
    return { recog: recog, prod: prod, total: total };
  }

  function rail() {
    var el = document.getElementById("rail"), cur = BY[q.list[pos]] || null;
    var c = cur ? (state.cards[cur.id] || card()) : null, k = counts();
    var seedNote = state.seedFound
      ? state.seedFound + " item(s) started as introduced, from ticks in c.html and python.html."
      : "No existing ticks were found, so every item starts unseen. That is a finding, not a default.";
    var h = "";
    h += '<div class="rblock"><h3>Today</h3>'
       + row("language", state.lang === "c" ? "C" : state.lang === "py" ? "Python" : "both")
       + row("due", q.list.length) + row("backlog", q.backlog)
       + row("streak", state.streak.count + " (+" + state.streak.grace + "g)")
       + '<p class="rnote">' + esc(seedNote) + '</p></div>';
    if (cur) {
      h += '<div class="rblock"><h3>This item</h3>'
         + row("id", cur.id) + row("rung", cur.absent ? "absence" : (c.rung === 0 ? "recognition" : "recall"))
         + row("seen", c.reps) + row("next", c.reps ? "+" + c.interval + "d" : "new")
         + '</div>';
    }
    h += '<div class="rblock"><h3>Counts</h3>'
       + row("recognised", k.recog + " / " + k.total)
       + row("recalled", k.prod + " / " + k.total)
       + '<p class="rnote">Two figures, never one. Picking the right line from four is not '
       + 'the same as producing it, so they are never added together.</p></div>';

    var mine = (state.log || []).filter(function (e) { return inLang(e.pid) && e.day === today(); });
    h += '<div class="rblock"><h3>This session</h3>';
    if (!mine.length) {
      h += '<p class="rnote">Nothing answered yet today. Every answer lands here with the '
         + 'interval it earned, so you can see what the scheduler just decided.</p>';
    } else {
      h += '<div class="log">';
      mine.slice(-12).reverse().forEach(function (e) {
        var c = state.cards[e.pid] || {};
        h += '<div class="' + (e.ok ? "ok" : "no") + '"><code>' + esc(e.pid) + '</code>'
           + '<b>' + (e.ok ? "+" + (c.interval || 1) + "d" : "1d") + '</b></div>';
      });
      h += '</div>';
      var got = mine.filter(function (e) { return e.ok; }).length;
      h += '<p class="rnote">' + got + ' of ' + mine.length + ' right today.</p>';
    }
    h += '</div>';
    el.innerHTML = h;
    if (state.lang) paintTree("navrail", true);
  }
  function row(k, v) { return '<div class="rrow"><span>' + esc(k) + '</span><b>' + esc(String(v)) + '</b></div>'; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
    });
  }

  /* ---- drill ------------------------------------------------------------ */
  /* Q3 revised 2026-09-03: you do one language at a time. The first run asks
     which rather than picking for you, and the answer is a setting, not a lock —
     the bar in the header switches it whenever you want. */
  function chooser() {
    document.getElementById("vDrill").innerHTML =
      '<p class="en">Which language are you drilling?</p>'
      + '<p class="note" style="margin:6px 0 0">One at a time. You can switch whenever you like, '
      + 'and each language keeps its own schedule — switching does not reset anything.</p>'
      + '<div class="choose">'
      + '<button data-l="c"><b>C</b><span>69 items. Printing, memory and ownership, the '
      + 'preprocessor, your own types.</span></button>'
      + '<button data-l="py"><b>Python</b><span>104 items. Collections, functions, text and '
      + 'dates, plus a DOM207 tail you can leave alone.</span></button>'
      + '</div>';
    [].slice.call(document.querySelectorAll(".choose button")).forEach(function (b) {
      b.onclick = function () { setLang(b.getAttribute("data-l")); };
    });
    rail();
  }

  function setLang(l) {
    state.lang = l; save();
    [].slice.call(document.querySelectorAll("#langbar button")).forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === l));
    });
    q = buildQueue(); pos = 0; answered = 0; correct = 0; paint();
  }

  /* ---- character breakdown ---------------------------------------------- */
  function breakdown(it, open) {
    if (!it.spans) return "";
    var line = "", all = "", n = 0;
    it.spans.forEach(function (s, i) {
      if (s.k === "ws") { line += esc(s.t); return; }
      line += '<button class="sp ' + s.k + (s.amb ? " amb" : "") + '" data-s="' + i
            + '" aria-pressed="false" title="' + esc(s.d || "") + '">' + esc(s.t) + '</button>';
      all += '<div data-r="' + i + '"><code>' + esc(s.t) + '</code><span>'
           + (s.amb ? '<span class="amb">from position: </span>' : '')
           + esc(s.d || "") + '</span></div>';
      n++;
    });
    /* Short lines put the list beside the line. Long ones put it underneath and
       let it use the full width, so it never needs a scrollbar of its own. */
    var many = n > 18;
    return '<div class="brk"><h4>What every character does &mdash; ' + n + ' pieces</h4>'
         + '<div class="brkgrid' + (many ? "" : " wide") + '">'
         + '<div><div class="brkline">' + line + '</div>'
         + '<div class="spd" id="spd">Click any piece of the line to single it out. '
         + 'A dashed underline means the reading was taken from position, not parsed.</div></div>'
         + '<div class="brkall' + (many ? " many" : "") + '" id="brkall">' + all + '</div>'
         + '</div></div>';
  }

  function wireBreakdown(it) {
    var btns = [].slice.call(document.querySelectorAll(".sp"));
    btns.forEach(function (b) {
      b.onclick = function () {
        btns.forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        var i = b.getAttribute("data-s"), s = it.spans[+i];
        document.getElementById("spd").innerHTML =
          "<code>" + esc(s.t) + "</code> &mdash; "
          + (s.amb ? '<span class="amb">read from position, not parsed: </span>' : "")
          + esc(s.d || "");
        var rows = [].slice.call(document.querySelectorAll("#brkall div"));
        rows.forEach(function (r) { r.classList.toggle("on", r.getAttribute("data-r") === i); });
      };
    });
  }

  function paint() {
    var el = document.getElementById("vDrill");
    if (!state.lang) { chooser(); return; }
    if (pos >= q.list.length) {
      if (answered) { bumpStreak(); save(); }
      el.innerHTML = answered
        ? "<p class='en'>Done for today.</p><p class='note'>" + correct + " of " + answered
          + " right. Streak " + state.streak.count + "."
          + (q.backlog ? " " + q.backlog + " still in the backlog — it is not hidden, it is deferred." : "")
          + "</p>"
        : "<p class='en'>Nothing due.</p><p class='note'>Every unit has been opened and nothing is "
          + "scheduled for today. Reviews are not pulled forward: bringing them closer would destroy "
          + "the spacing that makes them work.</p>";
      rail(); return;
    }
    var it = BY[q.list[pos]], c = state.cards[it.id] || card();
    var pct = Math.round((pos / q.list.length) * 100);
    var h = '<div class="bar"><i style="width:' + pct + '%"></i></div>';

    if (it.hash && c.hash && c.hash !== it.hash) {
      h += '<div class="banner">This item changed since you learned it. Its history is kept — '
         + 'nothing has been reset — but the question is no longer quite the one you answered.</div>';
    }
    h += '<p class="en">' + esc(it.en) + '</p>';
    h += '<p class="meta">' + esc(it.sec_title) + ' &middot; ' + (it.lang === "c" ? "C" : "PYTHON")
       + ' &middot; ' + esc(it.id) + '</p>';

    if (it.absent) {
      h += '<div class="opts one">'
         + optBtn(0, (it.lang === "c" ? "C" : "Python") + " has no direct equivalent")
         + optBtn(1, "There is a one-line form for this")
         + '</div><p class="note" id="expl"></p>';
      el.innerHTML = h; wireAbsence(it, c); rail(); return;
    }

    /* Teach before test, but only the first time this item is ever seen. On a
       review the answer is not shown first — that would remove the retrieval
       the scheduler exists to schedule. */
    if (!c.introduced && phase === "ask") {
      h += '<div class="teach"><p>New. Here it is once, then you are asked.</p><pre>'
         + esc(it.answer) + '</pre>'
         + (it.note ? '<p style="margin-top:8px">' + it.note + '</p>' : '') + '</div>'
         + breakdown(it, false)
         + '<div class="opts one" style="margin-top:14px">'
         + '<button class="go" id="gotit">Got it — ask me</button></div>';
      el.innerHTML = h;
      wireBreakdown(it);
      document.getElementById("gotit").onclick = function () {
        c.introduced = true; state.cards[it.id] = c; save(); paint();
      };
      rail(); return;
    }

    if (c.rung >= 1 && it.blank) {
      h += '<div class="teach"><pre>' + esc(it.blank) + '</pre></div>'
         + '<div class="blankwrap"><input id="blankIn" autocomplete="off" spellcheck="false" '
         + 'placeholder="the hidden token"><button class="iconbtn" id="blankGo">Check</button></div>'
         + '<p class="msg" id="msg"></p><p class="note" id="expl"></p>';
      el.innerHTML = h; wireBlank(it, c); rail(); return;
    }

    h += '<div class="opts">';
    it.options.forEach(function (o, i) { h += optBtn(i, o); });
    h += '</div><p class="msg" id="msg"></p><p class="note" id="expl"></p>';
    el.innerHTML = h; wireMcq(it, c); rail();
  }

  function optBtn(i, text) {
    return '<button class="opt" data-i="' + i + '">' + esc(text) + '</button>';
  }

  function settle(it, c, ok, msgEl) {
    c.hash = it.hash;
    /* `done` mirrors `cards` so index.html can count this file with the same
       rule it uses for the other four. It is derived, never read back here. */
    if (!state.done) state.done = {};
    if (ok || c.reps > 0) state.done[it.id] = true;
    if (ok && c.rung === 0 && it.blank) c.rung = 1;
    else if (!ok && c.rung > 0) c.rung = 0;
    state.cards[it.id] = review(c, ok);
    answered++; if (ok) correct++;
    state.log.push({ pid: it.id, day: today(), ok: ok });
    if (state.log.length > 400) state.log = state.log.slice(-400);
    save();
    var e = document.getElementById("expl");
    if (e) {
      e.innerHTML = (it.note || it.text || "") + breakdown(it, false);
      wireBreakdown(it);
    }
    /* A wrong answer earns time to read the breakdown rather than being swept
       away by a timer; you advance when you say so. */
    var bar = document.createElement("div");
    bar.className = "opts";
    bar.style.marginTop = "14px";
    bar.className = "opts one";
    bar.innerHTML = '<button class="go" id="nextBtn">Next</button>';
    if (e) e.parentNode.appendChild(bar);
    document.getElementById("nextBtn").onclick = function () {
      pos++; phase = "ask"; paint();
    };
  }

  function wireMcq(it, c) {
    var btns = [].slice.call(document.querySelectorAll(".opt"));
    btns.forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i"), ok = i === it.correct;
        btns.forEach(function (x) { x.disabled = true; });
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) btns[it.correct].classList.add("right");
        var m = document.getElementById("msg");
        m.className = "msg " + (ok ? "ok" : "no");
        m.textContent = ok ? "Yes." : "No — that is the line above.";
        settle(it, c, ok, m);
      };
    });
  }

  function wireBlank(it, c) {
    function go() {
      var v = document.getElementById("blankIn").value.trim();
      var ok = v === it.blank_token;
      var m = document.getElementById("msg");
      m.className = "msg " + (ok ? "ok" : "no");
      m.textContent = ok ? "Yes." : "No — it was " + it.blank_token + ".";
      document.getElementById("blankIn").disabled = true;
      document.getElementById("blankGo").disabled = true;
      settle(it, c, ok, m);
    }
    document.getElementById("blankGo").onclick = go;
    document.getElementById("blankIn").addEventListener("keydown", function (e) {
      if (e.key === "Enter") go();
    });
    document.getElementById("blankIn").focus();
  }

  function wireAbsence(it, c) {
    var btns = [].slice.call(document.querySelectorAll(".opt"));
    btns.forEach(function (b) {
      b.onclick = function () {
        var ok = +b.getAttribute("data-i") === 0;
        btns.forEach(function (x) { x.disabled = true; });
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) btns[0].classList.add("right");
        document.getElementById("expl").innerHTML = it.text;
        c.introduced = true;
        settle(it, c, ok, null);
      };
    });
  }

  /* ---- units ------------------------------------------------------------ */
  function paintTree(target, compact) {
    var cur = BY[q.list[pos]], curSec = cur ? cur.sec : null;
    var h = compact ? '<div class="rblock"><h3>Units</h3><div class="units">' : '<div class="units">';
    D.units.forEach(function (u) {
      var mine = u.items.filter(inLang);
      if (!mine.length) return;
      var done = mine.filter(function (id) {
        var c = state.cards[id]; return c && c.reps > 0;
      }).length;
      h += '<div class="unit' + (u.tail ? " tailu" : "") + (u.id === curSec ? " now" : "")
         + '"><span class="nm">' + esc(u.title)
         + '</span><span class="ct">' + done + " / " + mine.length + '</span></div>';
    });
    h += '</div>';
    h += compact
      ? '<p class="rnote">Dashed units are the tail &mdash; DOM207 material, not syntax. '
        + 'They come last.</p></div>'
      : '<p class="note">Dashed units are the tail: three phrasebook sections carry no C at '
        + 'all and are DOM207 data-science material rather than Python syntax. They come last.</p>';
    document.getElementById(target).innerHTML = h;
  }

  /* ---- data -------------------------------------------------------------- */
  function stamp() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  function download(name, text, type) {
    var b = new Blob([text], { type: type || "text/plain" }), u = URL.createObjectURL(b);
    var a = document.createElement("a"); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
  }
  function say(m) { document.getElementById("dataMsg").textContent = m; }
  document.getElementById("btnBackup").onclick = function () {
    download("cuolingo-progress-" + stamp() + ".json", JSON.stringify(state, null, 2), "application/json");
    say("Backup written.");
  };
  document.getElementById("btnCsv").onclick = function () {
    var rows = ["id,lang,section,reps,rung,ease,interval,due"];
    Object.keys(state.cards).forEach(function (id) {
      var c = state.cards[id], it = BY[id] || {};
      rows.push([id, it.lang || "", '"' + (it.sec_title || "") + '"', c.reps, c.rung,
                 c.ease.toFixed(2), c.interval, c.due].join(","));
    });
    download("cuolingo-cards-" + stamp() + ".csv", rows.join("\n"), "text/csv");
    say(Object.keys(state.cards).length + " card(s) exported.");
  };
  document.getElementById("btnRestore").onclick = function () { document.getElementById("fileRestore").click(); };
  document.getElementById("fileRestore").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var next = migrate(JSON.parse(r.result));
        if (!next.cards) throw new Error("no cards in that file");
        state = next; save(); start(); say("Restored.");
      } catch (err) { say("That file was not a cuolingo backup: " + err.message); }
    };
    r.readAsText(f);
  };

  /* ---- theme + tabs ------------------------------------------------------ */
  function applyTheme() {
    var r = document.documentElement;
    if (state.theme) r.setAttribute("data-theme", state.theme); else r.removeAttribute("data-theme");
    document.getElementById("themebtn").textContent =
      state.theme === "dark" ? "Dark" : state.theme === "light" ? "Light" : "System";
  }
  document.getElementById("themebtn").onclick = function () {
    state.theme = state.theme === null ? "light" : state.theme === "light" ? "dark" : null;
    applyTheme(); save();
  };
  [].slice.call(document.querySelectorAll("#langbar button")).forEach(function (b) {
    b.onclick = function () { setLang(b.getAttribute("data-l")); };
  });

  var TABS = { tabDrill: "vDrill", tabTree: "vTree", tabData: "vData" };
  Object.keys(TABS).forEach(function (t) {
    document.getElementById(t).onclick = function () {
      Object.keys(TABS).forEach(function (o) {
        document.getElementById(o).setAttribute("aria-selected", String(o === t));
        document.getElementById(TABS[o]).classList.toggle("hide", o !== t);
      });
      if (t === "tabTree") paintTree("vTree", false);
    };
  });

  function start() {
    seed();
    [].slice.call(document.querySelectorAll("#langbar button")).forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === state.lang));
    });
    q = buildQueue(); pos = 0; answered = 0; correct = 0; applyTheme(); paint();
  }
  window.__cuolingo = { state: function () { return state; }, queue: function () { return q; },
                        paint: paint, start: start, data: D };
  start();
})();
</script>
</body></html>
